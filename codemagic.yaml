workflows:
  android-motoboy-debug:
    name: Motoboy App Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: motoboy-app-nativo
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Add Android platform (if missing)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Capacitor Sync
        script: |
          npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk


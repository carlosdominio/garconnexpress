  ios-garcom-build:
    name: Garçom iOS Simulator & IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: garcom-app-nativo
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Add iOS platform (if missing)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
      - name: Capacitor Sync iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build iOS Simulator App (.app.zip para Appetize.io / Testes Online)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""
          
          SIM_APP=$(find build-sim/Build/Products -name "*.app" -type d | head -n 1)
          echo "Simulator App encontrado em: $SIM_APP"
          if [ -n "$SIM_APP" ]; then
            cd "$(dirname "$SIM_APP")"
            zip -r -X "$CM_BUILD_DIR/GarcomExpress-Simulator.zip" "$(basename "$SIM_APP")"
            mkdir -p "$CM_BUILD_DIR/garcom-app-nativo"
            cp "$CM_BUILD_DIR/GarcomExpress-Simulator.zip" "$CM_BUILD_DIR/garcom-app-nativo/GarcomExpress-Simulator.zip"
            echo "Artifact GarcomExpress-Simulator.zip gerado com sucesso!"
          else
            echo "ERRO: Simulator App não encontrado!"
            exit 1
          fi
      - name: Build iOS IPA (Unsigned)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-dev \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true
          
          DEV_APP=$(find build-dev/Build/Products -name "*.app" -type d | head -n 1)
          echo "Device App encontrado em: $DEV_APP"
          if [ -n "$DEV_APP" ]; then
            cd "$CM_BUILD_DIR/garcom-app-nativo/ios/App"
            rm -rf Payload
            mkdir -p Payload
            cp -r "$DEV_APP" Payload/
            zip -r "$CM_BUILD_DIR/GarcomExpress-Unsigned.ipa" Payload
            cp "$CM_BUILD_DIR/GarcomExpress-Unsigned.ipa" "$CM_BUILD_DIR/garcom-app-nativo/GarcomExpress-Unsigned.ipa"
            echo "Artifact GarcomExpress-Unsigned.ipa gerado com sucesso!"
          fi
    artifacts:
      - "**/GarcomExpress*.zip"
      - "**/GarcomExpress*.ipa"
      - "GarcomExpress*.zip"
      - "GarcomExpress*.ipa"
      - "garcom-app-nativo/GarcomExpress*.zip"
      - "garcom-app-nativo/GarcomExpress*.ipa"
